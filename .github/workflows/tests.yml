name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm exec prettier --check .
      - name: Check types
        run: pnpm run check
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Build
        run: pnpm run build
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [checks, build]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
