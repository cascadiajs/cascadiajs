name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm exec prettier --check .
      - name: Check types
        run: pnpm run check
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Build
        run: pnpm run build
  unit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # The Playwright image has Chromium and its OS dependencies preinstalled.
    # Keep the tag equal to the @playwright/test version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    needs: [checks, build]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Run unit tests
        run: pnpm run test:unit
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # The Playwright image has Chromium and its OS dependencies preinstalled.
    # Keep the tag equal to the @playwright/test version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    needs: [checks, build]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Run Playwright tests
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
