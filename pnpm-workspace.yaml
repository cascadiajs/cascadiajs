# Not a workspace declaration (no `packages:` key) — this file exists because
# pnpm reads build-script approval from here, not from .npmrc. Without it,
# strictDepBuilds (default true) fails the install on unreviewed build scripts.
allowBuilds:
  esbuild: true
  sharp: true
  # Optional install steps for the Netlify CLI (test server only); not needed.
  netlify-cli: false
  unix-dgram: false
  # posthog-js dependency; its postinstall only prints a funding banner.
  core-js: false
